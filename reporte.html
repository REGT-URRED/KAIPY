<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- CSP: sin scripts inline (todo es 'self'); style 'unsafe-inline' por
       style="" de Leaflet y placeholders. connect-src incluye el API dev. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:3000; font-src 'self'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Detalle - kaipy</title>
  <meta name="theme-color" content="#0c0a09">
  <!-- PWA: agregar a pantalla de inicio (iPhone) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e11d48'/%3E%3Ccircle cx='50' cy='42' r='22' fill='white'/%3E%3Cpath d='M50 62 L32 80 L68 80 Z' fill='white'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="src/assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <!-- VENDOR -->
  <link rel="stylesheet" href="src/assets/vendor/leaflet/leaflet.css">
  <!-- BASE -->
  <link rel="stylesheet" href="src/styles/base/variables.css">
  <link rel="stylesheet" href="src/styles/base/reset.css">
  <link rel="stylesheet" href="src/styles/base/typography.css">
  <!-- ATOMS -->
  <link rel="stylesheet" href="src/styles/atoms/buttons.css">
  <link rel="stylesheet" href="src/styles/atoms/badges.css">
  <!-- ORGANISMS -->
  <link rel="stylesheet" href="src/styles/organisms/topbar.css">
  <link rel="stylesheet" href="src/styles/organisms/map.css">
  <link rel="stylesheet" href="src/styles/organisms/toast.css">
  <!-- TEMPLATES -->
  <link rel="stylesheet" href="src/styles/templates/detail.css">
  <!-- PAGES -->
</head>
<body class="page-reporte">
  <!-- ============ ORGANISM: topbar ============ -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" class="topbar__brand">kaip<span class="brand-y">y</span></a>
      <nav class="topbar__nav" aria-label="Principal">
        <a href="index.html" class="topbar__nav-item">Ver</a>
        <a href="stats.html" class="topbar__nav-item">Estadísticas</a>
      </nav>
      <div class="topbar__actions">
        <a class="btn btn--ghost" href="index.html">Volver</a>
        <button id="theme-toggle" class="btn btn--ghost topbar__theme" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ============ TEMPLATE: detail ============ -->
    <article class="detail-page">
      <!-- Hero: foto + badges -->
      <div id="detail-hero" class="detail-page__hero">
        <div class="detail-page__hero-badges">
          <span id="detail-category" class="badge badge--category"></span>
          <span id="detail-state" class="badge"></span>
        </div>
      </div>

      <div class="detail-page__body">
        <h1 id="detail-title" class="detail-page__title">Cargando...</h1>

        <p id="detail-description" class="detail-page__description"></p>

        <!-- Datos rapidos -->
        <div class="detail-page__info">
          <div class="detail-page__info-item">
            <span class="detail-page__info-label">Lo vieron</span>
            <span id="detail-votes" class="detail-page__info-value">0</span>
          </div>
          <div class="detail-page__info-item">
            <span class="detail-page__info-label">Fecha</span>
            <span id="detail-date" class="detail-page__info-value"></span>
          </div>
          <div class="detail-page__info-item">
            <span class="detail-page__info-label">Ubicacion</span>
            <span id="detail-coords" class="detail-page__info-value"></span>
          </div>
        </div>

        <!-- Mapa -->
        <div class="detail-page__map">
          <p class="detail-page__map-label">Ubicacion reportada</p>
          <div class="map">
            <div id="map-detail" class="map__canvas"></div>
          </div>
        </div>
      </div>
    </article>
  </main>

  <!-- ============ ORGANISM: sticky actions ============ -->
  <div class="detail-page__actions">
    <div class="detail-page__actions-inner">
      <button id="vote-btn" class="btn btn--primary" type="button">Yo tambien lo vi</button>
    </div>
  </div>

  <!-- VENDOR -->
  <script src="src/scripts/modules/theme.js"></script>
  <script src="src/assets/vendor/leaflet/leaflet.js"></script>
  <script src="src/assets/vendor/fingerprintjs/fp.min.js"></script>
  <!-- CORE -->
  <script src="src/scripts/core/config.js"></script>
  <script src="src/scripts/core/utils.js"></script>
  <script src="src/scripts/modules/services.js"></script>
  <!-- MODULES -->
  <script src="src/scripts/modules/fingerprint.js"></script>
  <script src="src/scripts/modules/storage.js"></script>
  <script src="src/scripts/modules/geolocation.js"></script>
  <script src="src/scripts/modules/map.js"></script>
  <script src="src/scripts/modules/report-detail.js"></script>
</body>
</html>
