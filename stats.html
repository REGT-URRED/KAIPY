<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- CSP: sin scripts inline (todo es 'self'); style 'unsafe-inline' por
       style="" de Leaflet y placeholders. connect-src incluye el API dev. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org; connect-src 'self' http://localhost:3000; font-src 'self'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="no-referrer">
  <title>Estadisticas - kaipy</title>
  <meta name="theme-color" content="#0c0a09">
  <!-- PWA: agregar a pantalla de inicio (iPhone) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23e11d48'/%3E%3Ccircle cx='50' cy='42' r='22' fill='white'/%3E%3Cpath d='M50 62 L32 80 L68 80 Z' fill='white'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="src/assets/img/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <!-- BASE -->
  <link rel="stylesheet" href="src/styles/base/variables.css">
  <link rel="stylesheet" href="src/styles/base/reset.css">
  <link rel="stylesheet" href="src/styles/base/typography.css">
  <!-- ATOMS -->
  <link rel="stylesheet" href="src/styles/atoms/buttons.css">
  <link rel="stylesheet" href="src/styles/atoms/badges.css">
  <!-- MOLECULES -->
  <link rel="stylesheet" href="src/styles/molecules/stat-card.css">
  <!-- ORGANISMS -->
  <link rel="stylesheet" href="src/styles/organisms/topbar.css">
  <link rel="stylesheet" href="src/styles/organisms/bottom-nav.css">
  <link rel="stylesheet" href="src/styles/organisms/toast.css">
  <!-- TEMPLATES -->
  <link rel="stylesheet" href="src/styles/templates/stats.css">
  <!-- PAGES -->
</head>
<body class="page-stats">
  <!-- ============ ORGANISM: topbar ============ -->
  <header class="topbar">
    <div class="topbar__inner">
      <a href="index.html" class="topbar__brand">kaip<span class="brand-y">y</span></a>
      <nav class="topbar__nav" aria-label="Principal">
        <a href="index.html" class="topbar__nav-item">Ver</a>
        <a href="stats.html" class="topbar__nav-item is-active">Estadísticas</a>
      </nav>
      <div class="topbar__actions">
        <span class="topbar__count">Estadisticas</span>
        <button id="theme-toggle" class="btn btn--ghost topbar__theme" type="button" aria-label="Cambiar tema" title="Cambiar tema">
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
          </svg>
          <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="stats-view">
    <!-- Resumen general -->
    <section class="stats-strip" aria-label="Resumen">
      <div class="stat-card stat-card--accent">
        <span id="s-total" class="stat-card__value">0</span>
        <span class="stat-card__label">Reportes</span>
      </div>
      <div class="stat-card">
        <span id="s-open" class="stat-card__value">0</span>
        <span class="stat-card__label">Abiertos</span>
      </div>
      <div class="stat-card">
        <span id="s-review" class="stat-card__value">0</span>
        <span class="stat-card__label">En revision</span>
      </div>
      <div class="stat-card">
        <span id="s-resolved" class="stat-card__value">0</span>
        <span class="stat-card__label">Resueltos</span>
      </div>
    </section>

    <!-- Reportes por categoria -->
    <section class="stats-card" aria-labelledby="bycat-title">
      <h2 id="bycat-title" class="stats-card__title">Reportes por categoria</h2>
      <div id="stats-categories" class="stats-bars"></div>
    </section>

    <!-- Apoyos totales -->
    <section class="stats-card" aria-labelledby="votes-title">
      <h2 id="votes-title" class="stats-card__title">Apoyo colectivo</h2>
      <p class="stats-card__text">
        <strong id="s-votes">0</strong> personas confirmaron reportes con
        "yo tambien lo vi".
      </p>
      <p class="stats-card__text" id="s-top"></p>
    </section>
  </main>

  <!-- ============ ORGANISM: bottom-nav ============ -->
  <nav class="bottom-nav" aria-label="Navegacion">
    <div class="bottom-nav__inner">
      <a href="index.html" class="bottom-nav__item">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </span>Ver
      </a>
      <a href="reportar.html" class="bottom-nav__item bottom-nav__fab" aria-label="Nuevo reporte">
        <span class="btn btn--primary">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
        </span>
      </a>
      <a href="stats.html" class="bottom-nav__item is-active">
        <span class="bottom-nav__icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <line x1="12" y1="20" x2="12" y2="10"></line>
            <line x1="18" y1="20" x2="18" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="16"></line>
          </svg>
        </span>Estadísticas
      </a>
    </div>
  </nav>

  <!-- CORE -->
  <script src="src/scripts/modules/theme.js"></script>
  <script src="src/scripts/core/config.js"></script>
  <script src="src/scripts/core/utils.js"></script>
  <script src="src/scripts/modules/services.js"></script>
  <!-- MODULES -->
  <script src="src/scripts/modules/storage.js"></script>
  <script src="src/scripts/modules/demo-data.js"></script>
  <script src="src/scripts/modules/stats.js"></script>
</body>
</html>
